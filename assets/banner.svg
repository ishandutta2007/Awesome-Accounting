<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Gradient 1 -->
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Accent Gradient 2 -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes dashFlow {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes barGrow1 {
      0%, 100% { height: 70px; y: 220px; }
      50% { height: 110px; y: 180px; }
    }
    @keyframes barGrow2 {
      0%, 100% { height: 120px; y: 170px; }
      50% { height: 150px; y: 140px; }
    }
    @keyframes barGrow3 {
      0%, 100% { height: 95px; y: 195px; }
      50% { height: 135px; y: 155px; }
    }
    @keyframes barGrow4 {
      0%, 100% { height: 150px; y: 140px; }
      50% { height: 180px; y: 110px; }
    }
    @keyframes chartPulse {
      0%, 100% { stroke: #10b981; }
      50% { stroke: #38bdf8; }
    }
    @keyframes nodeBlink {
      0%, 100% { r: 5px; fill: #10b981; }
      50% { r: 8px; fill: #38bdf8; filter: drop-shadow(0 0 6px #38bdf8); }
    }
    .pulse-bg {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: center;
    }
    .floating-card {
      animation: floatSlow 4s ease-in-out infinite;
    }
    .grid-line {
      stroke: #334155;
      stroke-opacity: 0.25;
      stroke-dasharray: 4 4;
    }
    .flow-line {
      stroke: url(#accentGrad1);
      stroke-width: 3;
      stroke-dasharray: 10 5;
      animation: dashFlow 20s linear infinite, chartPulse 4s ease-in-out infinite;
    }
    .bar-1 { animation: barGrow1 4s ease-in-out infinite; }
    .bar-2 { animation: barGrow2 4.5s ease-in-out infinite; }
    .bar-3 { animation: barGrow3 3.8s ease-in-out infinite; }
    .bar-4 { animation: barGrow4 5s ease-in-out infinite; }
    .node { animation: nodeBlink 3s ease-in-out infinite; }
    .main-title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 52px;
      fill: #ffffff;
      letter-spacing: -1px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
      letter-spacing: 0.5px;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #10b981;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Ambient Glow Spheres -->
  <circle cx="200" cy="100" r="180" fill="#6366f1" opacity="0.12" filter="url(#glow)" class="pulse-bg" />
  <circle cx="1000" cy="300" r="220" fill="#10b981" opacity="0.15" filter="url(#glow)" class="pulse-bg" />
  <circle cx="600" cy="200" r="150" fill="#06b6d4" opacity="0.08" filter="url(#glow)" class="pulse-bg" />

  <!-- Background Grid Lines -->
  <line x1="80" y1="80" x2="1120" y2="80" class="grid-line" />
  <line x1="80" y1="160" x2="1120" y2="160" class="grid-line" />
  <line x1="80" y1="240" x2="1120" y2="240" class="grid-line" />
  <line x1="80" y1="320" x2="1120" y2="320" class="grid-line" />
  <line x1="200" y1="40" x2="200" y2="360" class="grid-line" />
  <line x1="400" y1="40" x2="400" y2="360" class="grid-line" />
  <line x1="600" y1="40" x2="600" y2="360" class="grid-line" />
  <line x1="800" y1="40" x2="800" y2="360" class="grid-line" />
  <line x1="1000" y1="40" x2="1000" y2="360" class="grid-line" />

  <!-- Right Side Interactive Dashboard Graphic -->
  <g class="floating-card" transform="translate(730, 70)">
    <!-- Card Frame -->
    <rect width="390" height="260" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" filter="url(#glow-subtle)" />
    
    <!-- Header Bar in Card -->
    <rect x="18" y="18" width="10" height="10" rx="5" fill="#ef4444" />
    <rect x="34" y="18" width="10" height="10" rx="5" fill="#f59e0b" />
    <rect x="50" y="18" width="10" height="10" rx="5" fill="#10b981" />
    <text x="75" y="27" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" font-weight="600">FINANCIAL LEDGER &amp; ANALYTICS</text>

    <!-- Animated Chart Bars -->
    <rect class="bar-1" x="50" y="200" width="30" height="90" rx="6" fill="#6366f1" fill-opacity="0.85" />
    <rect class="bar-2" x="100" y="150" width="30" height="140" rx="6" fill="#06b6d4" fill-opacity="0.85" />
    <rect class="bar-3" x="150" y="180" width="30" height="110" rx="6" fill="#10b981" fill-opacity="0.85" />
    <rect class="bar-4" x="200" y="120" width="30" height="170" rx="6" fill="url(#goldGrad)" fill-opacity="0.9" />

    <!-- Trend Line Flow -->
    <path class="flow-line" d="M 65 190 Q 115 130, 165 160 T 215 105 T 330 75" fill="none" />

    <!-- Data Nodes on Trend Line -->
    <circle class="node" cx="65" cy="190" r="5" />
    <circle class="node" cx="165" cy="160" r="5" />
    <circle class="node" cx="215" cy="105" r="5" />
    <circle class="node" cx="330" cy="75" r="6" fill="#38bdf8" />

    <!-- Stat Pill -->
    <g transform="translate(250, 180)">
      <rect width="115" height="48" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
      <text x="12" y="20" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" font-weight="600">NET ASSETS</text>
      <text x="12" y="38" font-family="system-ui, sans-serif" font-size="16" fill="#10b981" font-weight="700">+$2.45M</text>
    </g>
  </g>

  <!-- Left Side Text & Branding -->
  <g transform="translate(80, 110)">
    <!-- Pill Badge -->
    <g transform="translate(0, 0)">
      <rect width="255" height="32" rx="16" fill="#064e3b" fill-opacity="0.6" stroke="#10b981" stroke-width="1" />
      <circle cx="16" cy="16" r="5" fill="#10b981" />
      <text x="30" y="21" class="badge-text">CURATED FINANCIAL STACK</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="85" class="main-title">
      Awesome <tspan fill="url(#accentGrad1)">Accounting</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="125" class="subtitle">
      Top SaaS Platforms &amp; Open-Source Financial Software
    </text>
    
    <text x="0" y="155" font-family="system-ui, sans-serif" font-size="15" fill="#64748b" font-weight="500">
      Bookkeeping • Invoicing • Double-Entry • ERP • Plain-Text Accounting
    </text>
  </g>
</svg>